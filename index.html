<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Decree & Cock Hero</title>
    <style>
        :root {
            --bg-deep: #0a0508;
            --bg-card: #160a12;
            --accent-pink: #ff2a75;
            --accent-purple: #9d00ff;
            --accent-teal: #00f0ff;
            --text-main: #f5f0f3;
            --text-muted: #b0a4ac;
            --danger: #ff0055;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(157, 0, 255, 0.25), inset 0 0 15px rgba(255, 42, 117, 0.1);
            border: 1px solid rgba(255, 42, 117, 0.3);
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            color: var(--accent-pink);
            margin-top: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 42, 117, 0.5);
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        button {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 42, 117, 0.4);
            transition: transform 0.1s, filter 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            filter: brightness(1.15);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #0077ff, var(--accent-teal));
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
            color: #000;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff0055, #880022);
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }

        .display-box {
            margin-top: 15px;
            text-align: left;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            min-height: 80px;
        }

        .display-box p {
            margin: 6px 0;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .hidden {
            display: none !important;
        }

        .prompt-title {
            color: var(--accent-teal);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        /* Main Event Mobile UI & Metronome */
        .command-display {
            font-size: 1.3rem;
            font-weight: 900;
            color: #fff;
            margin: 10px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            border: 2px solid var(--accent-pink);
            padding: 8px;
            text-align: center;
            text-shadow: 0 0 12px var(--accent-pink);
        }

        /* Metronome Visual Ring */
        .metronome-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
        }

        .metronome-pulse {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--accent-teal);
            box-shadow: 0 0 15px var(--accent-teal);
            transform: scale(0.8);
            transition: transform 0.15s ease-in-out, background 0.15s ease-in-out;
            margin-bottom: 5px;
        }

        .metronome-pulse.beat {
            transform: scale(1.15);
            background: var(--accent-pink);
            box-shadow: 0 0 25px var(--accent-pink);
        }

        .action-timer {
            font-size: 1.1rem;
            color: var(--accent-teal);
            margin-bottom: 5px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .task-alert-box {
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid var(--danger);
            color: #ffb8b8;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.8rem;
            text-align: left;
        }

        .meter-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 10px;
            margin: 10px 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .meter-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
            transition: width 1s linear;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .controls-row button {
            margin: 0;
            font-size: 0.8rem;
            padding: 10px 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Roulette Decree</h2>
        
        <!-- SETUP PHASE -->
        <div id="game-intro">
            <p>Ready to let fate dictate the session? Take the pressure off and let the rules handle the rest.</p>
            <button onclick="startSequence()">Let's Play</button>
        </div>

        <div id="game-sequence" class="hidden">
            <p id="instruction-text" class="prompt-title"></p>
            <button id="action-btn" onclick="nextStep()">Press to Roll</button>
            
            <div class="display-box" id="results-log">
                <p><em>Waiting for the first roll...</em></p>
            </div>
        </div>

        <!-- MAIN EVENT PHASE -->
        <div id="main-event-screen" class="hidden">
            <h3 id="stage-title" class="prompt-title" style="color: var(--accent-pink); margin: 0 0 5px 0;">Stage 1</h3>
            <p id="stage-instructions" style="font-size: 0.8rem; color: var(--text-muted); margin: 0 0 10px 0;"></p>
            
            <div class="command-display" id="live-command">PREPARING...</div>
            
            <!-- Metronome Visualizer -->
            <div class="metronome-box">
                <div class="metronome-pulse" id="pulse-ring"></div>
                <span id="tempo-label" style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Tempo: Syncing</span>
            </div>

            <div class="action-timer" id="action-timer-display">Action Time Left: 0s</div>
            
            <!-- Automated or Triggered Roulette Tasks -->
            <div class="task-alert-box" id="active-task-box">
                <strong>Active Directives:</strong><br>
                <span id="task-text">Awaiting phase triggers...</span>
            </div>
            
            <div class="meter-container">
                <div class="meter-bar" id="progress-bar"></div>
            </div>
            
            <p id="total-timer-display" style="font-weight: bold; font-size: 0.8rem; color: var(--text-muted); margin: 5px 0;">Total Session Time Left: 10:00</p>
            
            <div class="controls-row">
                <button class="btn-secondary" onclick="previewDecree()">Mistress Prep</button>
                <button class="btn-danger" onclick="skipStage()">Skip Action ➔</button>
            </div>
        </div>

    </div>

    <script>
        const subAttirePool = [
            "Fully strapped / leather harness", 
            "Completely bare / vulnerable", 
            "Locked tight in chastity", 
            "Collared, chained, and restrained"
        ];

        const domActionsPool = [
            "Choke the sub hard", 
            "Forced deepthroat task", 
            "Spit directly on the sub", 
            "Slap & aggressive impact play"
        ];

        const step3Pool = [
            "Allowed 1 full, messy orgasm", 
            "Strictly ruined & denied completely", 
            "Edge-fed only (permitted right at the final second)", 
            "Edged 3 times in a row, then permitted"
        ];

        const specialGameElementPool = [
            "Mandatory absolute stillness command during peak intensity", 
            "Forced sudden oral break mid-stroke", 
            "Immediate pain play punishment trigger", 
            "Forced humiliation speech check"
        ];

        let currentStep = 0;
        let sessionResults = {
            subAttire: "",
            domAction: "",
            step3Result: "",
            specialElement: ""
        };

        function startSequence() {
            document.getElementById('game-intro').classList.add('hidden');
            document.getElementById('game-sequence').classList.remove('hidden');
            updateStepPrompt();
        }

        function updateStepPrompt() {
            const instruction = document.getElementById('instruction-text');
            const btn = document.getElementById('action-btn');

            if (currentStep === 0) {
                instruction.textContent = "Mistress, step up first. Tap to see what your sub must wear:";
                btn.textContent = "Roll Sub's Attire";
            } else if (currentStep === 1) {
                instruction.textContent = "Sub's turn to tap. Let's see what the Mistress is permitted to inflict:";
                btn.textContent = "Roll Mistress Action";
            } else if (currentStep === 2) {
                instruction.textContent = "Third roll: Setting the final decree and limits:";
                btn.textContent = "Roll Session Decree";
            } else if (currentStep === 3) {
                instruction.textContent = "Final roll: Unlocking the special game element for the session:";
                btn.textContent = "Roll Special Element";
            } else {
                instruction.textContent = "Rules locked in. Ready to submit?";
                btn.textContent = "Launch Cock Hero Engine";
                btn.onclick = launchMainEvent;
            }
        }

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function nextStep() {
            const logDiv = document.getElementById('results-log');

            if (currentStep === 0) {
                sessionResults.subAttire = getRandomItem(subAttirePool);
                logDiv.innerHTML = `<p><strong>Sub Attire:</strong> ${sessionResults.subAttire}</p>`;
            } else if (currentStep === 1) {
                sessionResults.domAction = getRandomItem(domActionsPool);
                logDiv.innerHTML += `<p><strong>Mistress Action:</strong> ${sessionResults.domAction}</p>`;
            } else if (currentStep === 2) {
                sessionResults.step3Result = getRandomItem(step3Pool);
                logDiv.innerHTML += `<p><strong>Session Decree:</strong> ${sessionResults.step3Result}</p>`;
            } else if (currentStep === 3) {
                sessionResults.specialElement = getRandomItem(specialGameElementPool);
                logDiv.innerHTML += `<p><strong>Special Element:</strong> ${sessionResults.specialElement}</p>`;
            }

            currentStep++;
            updateStepPrompt();
        }

        // --- 10-MIN ENGINE WITH METRONOME ---
        let totalSessionSeconds = 600;
        let globalTimer;
        let currentActionIndex = 0;
        let actionTimeLeft = 0;
        let metronomeInterval = null;

        const actionSequence = [
            { stageName: "Stage 1: Conditioning", text: "Slow, agonizingly long strokes. Barely any friction.", duration: 40, bpm: 40, instructions: "Match rhythm: One slow stroke per pulse." },
            { stageName: "Stage 1: Conditioning", text: "HALT! Absolute stillness. Hands off completely.", duration: 20, bpm: 0, instructions: "Freeze completely. Do not move." },
            { stageName: "Stage 1: Conditioning", text: "Resume ultra-slow gliding strokes. Count every inch.", duration: 45, bpm: 45, instructions: "Match rhythm: Drag it out." },
            { stageName: "Stage 1: Conditioning", text: "Brief stop. Deep breath. Do not touch.", duration: 15, bpm: 0, instructions: "Stillness protocol active." },
            { stageName: "Stage 1: Conditioning", text: "Medium steady pace. Building heat.", duration: 60, bpm: 75, instructions: "Steady mid-speed friction." },

            { stageName: "Stage 2: Escalation", text: "Pick up the speed. Firm, rhythmic friction building fast.", duration: 40, bpm: 100, instructions: "Consistent faster tempo." },
            { stageName: "Stage 2: Escalation", text: "SUDDEN FREEZE! Drop your hand. Wait and stare.", duration: 25, bpm: 0, instructions: "Instant freeze command." },
            { stageName: "Stage 2: Escalation", text: "Fast short burst of speed—then instant stop!", duration: 15, bpm: 140, instructions: "Rapid bursts on the beat!" },
            { stageName: "Stage 2: Escalation", text: "Slow down immediately. Torturous, dragging strokes.", duration: 50, bpm: 40, instructions: "Drop back to agonizing slow." },
            { stageName: "Stage 2: Escalation", text: "Rhythmic mid-speed stroking. Stay controlled.", duration: 50, bpm: 80, instructions: "Find the groove." },
            { stageName: "Stage 2: Escalation", text: "Hold the shaft completely still. Let the urge spike.", duration: 20, bpm: 0, instructions: "No motion allowed." },

            { stageName: "Stage 3: Peak & Edging", text: "Fast, aggressive strokes pushing right to the brink!", duration: 30, bpm: 130, instructions: "Hard, fast rhythm!" },
            { stageName: "Stage 3: Peak & Edging", text: "EDGE AND HOLD! Freeze right at the edge!", duration: 20, bpm: 0, instructions: "Hold the edge without spilling." },
            { stageName: "Stage 3: Peak & Edging", text: "Cruel slow down right after the edge. Tease the drop.", duration: 35, bpm: 35, instructions: "Barely touching to survive the drop." },
            { stageName: "Stage 3: Peak & Edging", text: "Rapid-fire fast bursts with sudden dead stops!", duration: 20, bpm: 150, instructions: "Intense peak tempo." },
            { stageName: "Stage 3: Peak & Edging", text: "FINAL EDGE HOLD. Lock it in place. Await the ruling.", duration: 35, bpm: 0, instructions: "Final stillness test." }
        ];

        function launchMainEvent() {
            document.getElementById('game-sequence').classList.add('hidden');
            document.getElementById('main-event-screen').classList.remove('hidden');
            
            document.getElementById('task-text').innerHTML = 
                `<strong>Attire:</strong> ${sessionResults.subAttire}<br>` +
                `<strong>Permitted Action:</strong> ${sessionResults.domAction}<br>` +
                `<strong>Special Directive:</strong> ${sessionResults.specialElement}`;

            loadAction(0);
            startGlobalClock();
        }

        function startGlobalClock() {
            globalTimer = setInterval(() => {
                if (totalSessionSeconds > 0) {
                    totalSessionSeconds--;
                    let mins = Math.floor(totalSessionSeconds / 60);
                    let secs = totalSessionSeconds % 60;
                    document.getElementById('total-timer-display').textContent = 
                        `Total Session Time Left: ${mins}:${secs < 10 ? '0' : ''}${secs}`;

                    let progressPercent = ((600 - totalSessionSeconds) / 600) * 100;
                    document.getElementById('progress-bar').style.width = progressPercent + '%';
                }
            }, 1000);
        }

        function loadAction(index) {
            if (index >= actionSequence.length || totalSessionSeconds <= 0) {
                endGameSession();
                return;
            }
            currentActionIndex = index;
            const currentAction = actionSequence[currentActionIndex];

            document.getElementById('stage-title').textContent = currentAction.stageName;
            document.getElementById('stage-instructions').textContent = currentAction.instructions;
            document.getElementById('live-command').textContent = currentAction.text;
            
            actionTimeLeft = currentAction.duration;
            runActionTimer();
            setupMetronome(currentAction.bpm);
        }

        let actionTimer;
        function runActionTimer() {
            clearInterval(actionTimer);

            actionTimer = setInterval(() => {
                actionTimeLeft--;
                document.getElementById('action-timer-display').textContent = `Action Time Left: ${actionTimeLeft}s`;

                if (actionTimeLeft <= 0) {
                    clearInterval(actionTimer);
                    loadAction(currentActionIndex + 1);
                }
            }, 1000);
        }

        function setupMetronome(bpm) {
            clearInterval(metronomeInterval);
            const pulseRing = document.getElementById('pulse-ring');
            const tempoLabel = document.getElementById('tempo-label');

            if (bpm <= 0) {
                pulseRing.classList.remove('beat');
                tempoLabel.textContent = "Tempo: HOLD / FREEZE";
                return;
            }

            // Calculate milliseconds per beat from BPM
            const intervalMs = (60 / bpm) * 1000;
            tempoLabel.textContent = `Tempo: ${bpm} BPM`;

            metronomeInterval = setInterval(() => {
                pulseRing.classList.add('beat');
                setTimeout(() => {
                    pulseRing.classList.remove('beat');
                }, 120); // pulse flash length
            }, intervalMs);
        }

        function skipStage() {
            clearInterval(actionTimer);
            clearInterval(metronomeInterval);
            loadAction(currentActionIndex + 1);
        }

        function previewDecree() {
            alert(`MISTRESS PREPARATION INFO:\n\n` +
                  `- Sub Attire: ${sessionResults.subAttire}\n` +
                  `- Permitted Action: ${sessionResults.domAction}\n` +
                  `- Special Element: ${sessionResults.specialElement}\n` +
                  `- Final Decree: ${sessionResults.step3Result}\n\n` +
                  `Prepare any necessary tools, toys, or cleanup items right now.`);
        }

        function endGameSession() {
            clearInterval(globalTimer);
            clearInterval(actionTimer);
            clearInterval(metronomeInterval);
            document.getElementById('main-event-screen').innerHTML = `
                <h3 class="prompt-title" style="color: var(--accent-pink);">Session Complete</h3>
                <p>Final Ruling: <strong>${sessionResults.step3Result}</strong></p>
                <p><em>Accidental spillage note:</em> Tough luck—it is entirely up to the Mistress whether it is ignored or punished.</p>
                <p style="margin-top: 15px;">Execute final protocol.</p>
                <button onclick="location.reload()">Start New Session</button>
            `;
        }
    </script>

</body>
</html>
