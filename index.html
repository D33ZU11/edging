<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: monospace, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 600px;
            text-align: center;
        }
        button {
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #3700b3;
            color: #ffffff;
        }
        .btn-secondary {
            background-color: #03dac6;
        }
        .btn-secondary:hover {
            background-color: #018786;
        }
        .btn-danger {
            background-color: #cf6679;
        }
        .btn-danger:hover {
            background-color: #b00020;
        }
        .display-box {
            margin-top: 20px;
            text-align: left;
            background: #2d2d2d;
            padding: 15px;
            border-radius: 4px;
            min-height: 100px;
        }
        .display-box p {
            margin: 8px 0;
            font-size: 0.9rem;
        }
        .hidden {
            display: none;
        }
        .prompt-title {
            color: #bb86fc;
            font-weight: bold;
        }
        /* Main Event UI Styles */
        .command-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff7597;
            margin: 15px 0;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121212;
            border-radius: 4px;
            border: 1px solid #333;
            padding: 0 10px;
            text-align: center;
        }
        .action-timer {
            font-size: 1.2rem;
            color: #03dac6;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .task-alert-box {
            background: #3c1f1f;
            border: 1px solid #cf6679;
            color: #ffb8b8;
            padding: 10px;
            border-radius: 4px;
            margin: 15px 0;
            font-size: 0.85rem;
            text-align: left;
        }
        .meter-container {
            width: 100%;
            background: #2d2d2d;
            border-radius: 4px;
            height: 14px;
            margin: 15px 0;
            overflow: hidden;
        }
        .meter-bar {
            height: 100%;
            width: 0%;
            background: #bb86fc;
            transition: width 1s linear;
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
    </style>
</head>
<body>

        <h2>Session Roulette & Cock Hero</h2>
        
        <!-- SETUP PHASE -->
        <div id="game-intro">
            <p>Ready to establish the rules of engagement?</p>
            <button onclick="startSequence()">Begin Setup</button>
        </div>

        <div id="game-sequence" class="hidden">
            <p id="instruction-text" class="prompt-title"></p>
            <button id="action-btn" onclick="nextStep()">Press to Roll</button>
            
            <div class="display-box" id="results-log">
                <p><em>Waiting for rolls...</em></p>
            </div>
        </div>

        <!-- MAIN EVENT PHASE (10 MINS) -->
        <div id="main-event-screen" class="hidden">
            <h3 id="stage-title" class="prompt-title">Stage 1</h3>
            <p id="stage-instructions" style="font-size: 0.85rem; color: #ccc; min-height: 30px;"></p>
            
            <div class="command-display" id="live-command">PREPARING...</div>
            <div class="action-timer" id="action-timer-display">Action Time: 0s</div>
            
            <!-- Automated or Triggered Roulette Tasks -->
            <div class="task-alert-box" id="active-task-box">
                <strong>Active Rule & Directive:</strong><br>
                <span id="task-text">Awaiting phase triggers...</span>
            </div>
            
            <div class="meter-container">
                <div class="meter-bar" id="progress-bar"></div>
            </div>
            
            <p id="total-timer-display" style="font-weight: bold; font-size: 0.85rem; color: #aaa;">Total Session Time Left: 10:00</p>
            
            <div class="controls-row">
                <button class="btn-secondary" onclick="previewDecree()">Mistress Prep Info</button>
                <button class="btn-danger" onclick="skipStage()">Skip Current Action ➔</button>
            </div>
        </div>

    </div>

    <script>
        const subAttirePool = [
            "Fully strapped / harness", 
            "Completely bare / exposed", 
            "Locked in chastity", 
            "Collared and restrained"
        ];

        const domActionsPool = [
            "Choke the sub", 
            "Make them suck something", 
            "Spit at/on them", 
            "Slap / impact play"
        ];

        const step3Pool = [
            "Allowed 1 full orgasm", 
            "Strictly ruined / denied", 
            "Edge-fed only (permitted at very end)", 
            "Edged 3 times then permitted"
        ];

        const specialGameElementPool = [
            "Mandatory absolute stillness command during peak intensity", 
            "Forced oral break", 
            "Sudden pain play interval trigger", 
            "Forced humiliation speech check"
        ];

        let currentStep = 0;
        let sessionResults = {
            subAttire: "",
            domAction: "",
            step3Result: "",
            specialElement: ""
        };

        function startSequence() {
            document.getElementById('game-intro').classList.add('hidden');
            document.getElementById('game-sequence').classList.remove('hidden');
            updateStepPrompt();
        }

        function updateStepPrompt() {
            const instruction = document.getElementById('instruction-text');
            const btn = document.getElementById('action-btn');

            if (currentStep === 0) {
                instruction.textContent = "Mistress, you're up first. Press to determine what your sub must wear:";
                btn.textContent = "Roll Sub's Attire";
            } else if (currentStep === 1) {
                instruction.textContent = "Sub's turn to press. Let's see what the Mistress is permitted to do:";
                btn.textContent = "Roll Mistress Action";
            } else if (currentStep === 2) {
                instruction.textContent = "Third press: Determining the session outcome/limit:";
                btn.textContent = "Roll Session Decree";
            } else if (currentStep === 3) {
                instruction.textContent = "Final press: Unlocking the Mistress's special game element for the main event:";
                btn.textContent = "Roll Special Game Element";
            } else {
                instruction.textContent = "Setup Complete. Rules locked.";
                btn.textContent = "Launch 10-Minute Cock Hero";
                btn.onclick = launchMainEvent;
            }
        }

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function nextStep() {
            const logDiv = document.getElementById('results-log');

            if (currentStep === 0) {
                sessionResults.subAttire = getRandomItem(subAttirePool);
                logDiv.innerHTML = `<p><strong>Sub's Attire:</strong> ${sessionResults.subAttire}</p>`;
            } else if (currentStep === 1) {
                sessionResults.domAction = getRandomItem(domActionsPool);
                logDiv.innerHTML += `<p><strong>Mistress Action:</strong> ${sessionResults.domAction}</p>`;
            } else if (currentStep === 2) {
                sessionResults.step3Result = getRandomItem(step3Pool);
                logDiv.innerHTML += `<p><strong>Session Decree:</strong> ${sessionResults.step3Result}</p>`;
            } else if (currentStep === 3) {
                sessionResults.specialElement = getRandomItem(specialGameElementPool);
                logDiv.innerHTML += `<p><strong>Special Game Element:</strong> ${sessionResults.specialElement}</p>`;
            }

            currentStep++;
            updateStepPrompt();
        }

        // --- TIMED MICRO-ACTION ENGINE (10 MINS TOTAL) ---
        let totalSessionSeconds = 600; // 10 minutes
        let globalTimer;
        
        let currentActionIndex = 0;
        let actionTimeLeft = 0;

        // Sequence of specific physical instructions with distinct durations designed for maximum teasing
        const actionSequence = [
            // Phase 1: Conditioning & Long Slow Teases (Approx 3 mins)
            { stageName: "Stage 1: Conditioning", text: "Slow, agonizingly long strokes. Barely enough friction to feel good.", duration: 40 },
            { stageName: "Stage 1: Conditioning", text: "HALT. Absolute stillness. Hands off completely for a agonizing pause.", duration: 20 },
            { stageName: "Stage 1: Conditioning", text: "Resume ultra-slow gliding strokes. Count every single movement.", duration: 45 },
            { stageName: "Stage 1: Conditioning", text: "Brief stop. Deep breath. Do not touch.", duration: 15 },
            { stageName: "Stage 1: Conditioning", text: "Medium steady pace. Building initial blood flow and warmth.", duration: 60 },

            // Phase 2: Escalation & Rhythm Shifting (Approx 4 mins)
            { stageName: "Stage 2: Escalation", text: "Pick up the speed. Firm, rhythmic strokes building heat.", duration: 40 },
            { stageName: "Stage 2: Escalation", text: "SUDDEN FREEZE. Drop your hand. Wait and stare.", duration: 25 },
            { stageName: "Stage 2: Escalation", text: "Fast short burst of friction—then instant stop!", duration: 15 },
            { stageName: "Stage 2: Escalation", text: "Slow down immediately. Torturous, dragging strokes.", duration: 50 },
            { stageName: "Stage 2: Escalation", text: "Rhythmic mid-speed stroking. Maintain steady control.", duration: 50 },
            { stageName: "Stage 2: Escalation", text: "Hold the shaft still. Zero movement. Let the urge spike.", duration: 20 },

            // Phase 3: Peak Tease, Edging & Denial (Approx 3 mins)
            { stageName: "Stage 3: Peak & Edging", text: "Fast, aggressive strokes pushing right to the brink!", duration: 30 },
            { stageName: "Stage 3: Peak & Edging", text: "EDGE AND HOLD! Freeze right at the point of no return!", duration: 20 },
            { stageName: "Stage 3: Peak & Edging", text: "Cruel slow down right after the edge. Teasing the drop.", duration: 35 },
            { stageName: "Stage 3: Peak & Edging", text: "Rapid-fire fast bursts with sudden dead stops!", duration: 20 },
            { stageName: "Stage 3: Peak & Edging", text: "FINAL EDGE HOLD. Lock it in place. Await the final ruling.", duration: 35 }
        ];

        function launchMainEvent() {
            document.getElementById('game-sequence').classList.add('hidden');
            document.getElementById('main-event-screen').classList.remove('hidden');
            
            // Set initial task text box info
            document.getElementById('task-text').innerHTML = 
                `<strong>Attire Required:</strong> ${sessionResults.subAttire}<br>` +
                `<strong>Permitted Action:</strong> ${sessionResults.domAction}<br>` +
                `<strong>Special Rule:</strong> ${sessionResults.specialElement}`;

            loadAction(0);
            startGlobalClock();
        }

        function startGlobalClock() {
            globalTimer = setInterval(() => {
                if (totalSessionSeconds > 0) {
                    totalSessionSeconds--;
                    let mins = Math.floor(totalSessionSeconds / 60);
                    let secs = totalSessionSeconds % 60;
                    document.getElementById('total-timer-display').textContent = 
                        `Total Session Time Left: ${mins}:${secs < 10 ? '0' : ''}${secs}`;

                    let progressPercent = ((600 - totalSessionSeconds) / 600) * 100;
                    document.getElementById('progress-bar').style.width = progressPercent + '%';
                }
            }, 1000);
        }

        function loadAction(index) {
            if (index >= actionSequence.length || totalSessionSeconds <= 0) {
                endGameSession();
                return;
            }
            currentActionIndex = index;
            const currentAction = actionSequence[currentActionIndex];

            document.getElementById('stage-title').textContent = currentAction.stageName;
            document.getElementById('live-command').textContent = currentAction.text;
            
            actionTimeLeft = currentAction.duration;
            runActionTimer();
        }

        let actionTimer;
        function runActionTimer() {
            clearInterval(actionTimer);

            actionTimer = setInterval(() => {
                actionTimeLeft--;
                document.getElementById('action-timer-display').textContent = `Action Time Left: ${actionTimeLeft}s`;

                if (actionTimeLeft <= 0) {
                    clearInterval(actionTimer);
                    loadAction(currentActionIndex + 1);
                }
            }, 1000);
        }

        function skipStage() {
            clearInterval(actionTimer);
            loadAction(currentActionIndex + 1);
        }

        function previewDecree() {
            alert(`MISTRESS PREPARATION INFO:\n\n` +
                  `- Sub Attire: ${sessionResults.subAttire}\n` +
                  `- Permitted Action: ${sessionResults.domAction}\n` +
                  `- Special Element: ${sessionResults.specialElement}\n` +
                  `- Final Decree: ${sessionResults.step3Result}\n\n` +
                  `Prepare any necessary tools, cleaning gear, or restraints right now.`);
        }

        function endGameSession() {
            clearInterval(globalTimer);
            clearInterval(actionTimer);
            document.getElementById('main-event-screen').innerHTML = `
                <h3 class="prompt-title">Session Complete (10-Min Target Reached)</h3>
                <p>Final Ruling: <strong>${sessionResults.step3Result}</strong></p>
                <p><em>Accidental spillage note:</em> Tough luck—it is entirely up to the Mistress whether it is ignored or punished.</p>
                <p>Execute final protocol.</p>
                <button onclick="location.reload()">Start New Session</button>
            `;
        }
    </script>

</body>
</html>
