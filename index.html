<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Decree & Cock Hero 10-Min Engine</title>
    <style>
        body {
            font-family: monospace, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 580px;
            text-align: center;
        }
        button {
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #3700b3;
            color: #ffffff;
        }
        .btn-secondary {
            background-color: #03dac6;
        }
        .btn-secondary:hover {
            background-color: #018786;
        }
        .btn-danger {
            background-color: #cf6679;
        }
        .btn-danger:hover {
            background-color: #b00020;
        }
        .display-box {
            margin-top: 20px;
            text-align: left;
            background: #2d2d2d;
            padding: 15px;
            border-radius: 4px;
            min-height: 100px;
        }
        .display-box p {
            margin: 8px 0;
            font-size: 0.9rem;
        }
        .hidden {
            display: none;
        }
        .prompt-title {
            color: #bb86fc;
            font-weight: bold;
        }
        /* Main Event UI Styles */
        .command-display {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ff7597;
            margin: 15px 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121212;
            border-radius: 4px;
            border: 1px solid #333;
            padding: 0 10px;
            text-align: center;
        }
        .task-alert-box {
            background: #3c1f1f;
            border: 1px solid #cf6679;
            color: #ffb8b8;
            padding: 10px;
            border-radius: 4px;
            margin: 15px 0;
            font-size: 0.85rem;
            text-align: left;
        }
        .meter-container {
            width: 100%;
            background: #2d2d2d;
            border-radius: 4px;
            height: 18px;
            margin: 15px 0;
            overflow: hidden;
        }
        .meter-bar {
            height: 100%;
            width: 0%;
            background: #bb86fc;
            transition: width 1s linear;
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Session Roulette & Cock Hero</h2>
        
        <!-- SETUP PHASE -->
        <div id="game-intro">
            <p>Ready to establish the rules of engagement?</p>
            <button onclick="startSequence()">Begin Setup</button>
        </div>

        <div id="game-sequence" class="hidden">
            <p id="instruction-text" class="prompt-title"></p>
            <button id="action-btn" onclick="nextStep()">Press to Roll</button>
            
            <div class="display-box" id="results-log">
                <p><em>Waiting for rolls...</em></p>
            </div>
        </div>

        <!-- MAIN EVENT PHASE (10 MINS) -->
        <div id="main-event-screen" class="hidden">
            <h3 id="stage-title" class="prompt-title">Stage: Warm-Up</h3>
            <p id="stage-instructions" style="font-size: 0.85rem; color: #ccc; min-height: 35px;"></p>
            
            <div class="command-display" id="live-command">STAND BY...</div>
            
            <!-- Automated or Triggered Roulette Tasks -->
            <div class="task-alert-box" id="active-task-box">
                <strong>Active Rule & Directive:</strong><br>
                <span id="task-text">Awaiting phase triggers...</span>
            </div>
            
            <div class="meter-container">
                <div class="meter-bar" id="progress-bar"></div>
            </div>
            
            <p id="timer-display" style="font-weight: bold;">Stage Time Left: 3:00</p>
            
            <div class="controls-row">
                <button class="btn-secondary" onclick="previewDecree()">Mistress Prep Info</button>
                <button class="btn-danger" onclick="skipStage()">Skip Stage ➔</button>
            </div>
        </div>

    </div>

    <script>
        const subAttirePool = [
            "Fully strapped / harness", 
            "Completely bare / exposed", 
            "Locked in chastity", 
            "Collared and restrained"
        ];

        const domActionsPool = [
            "Choke the sub", 
            "Make them suck something", 
            "Spit at/on them", 
            "Slap / impact play"
        ];

        const step3Pool = [
            "Allowed 1 full orgasm", 
            "Strictly ruined / denied", 
            "Edge-fed only (permitted at very end)", 
            "Edged 3 times then permitted"
        ];

        const specialGameElementPool = [
            "Mandatory absolute stillness command during peak intensity", 
            "Forced oral break", 
            "Sudden pain play interval trigger", 
            "Forced humiliation speech check"
        ];

        let currentStep = 0;
        let sessionResults = {
            subAttire: "",
            domAction: "",
            step3Result: "",
            specialElement: ""
        };

        function startSequence() {
            document.getElementById('game-intro').classList.add('hidden');
            document.getElementById('game-sequence').classList.remove('hidden');
            updateStepPrompt();
        }

        function updateStepPrompt() {
            const instruction = document.getElementById('instruction-text');
            const btn = document.getElementById('action-btn');

            if (currentStep === 0) {
                instruction.textContent = "Mistress, you're up first. Press to determine what your sub must wear:";
                btn.textContent = "Roll Sub's Attire";
            } else if (currentStep === 1) {
                instruction.textContent = "Sub's turn to press. Let's see what the Mistress is permitted to do:";
                btn.textContent = "Roll Mistress Action";
            } else if (currentStep === 2) {
                instruction.textContent = "Third press: Determining the session outcome/limit:";
                btn.textContent = "Roll Session Decree";
            } else if (currentStep === 3) {
                instruction.textContent = "Final press: Unlocking the Mistress's special game element for the main event:";
                btn.textContent = "Roll Special Game Element";
            } else {
                instruction.textContent = "Setup Complete. Rules locked.";
                btn.textContent = "Launch 10-Minute Cock Hero";
                btn.onclick = launchMainEvent;
            }
        }

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() .length)] || arr[Math.floor(Math.random() * arr.length)];
        }

        function nextStep() {
            const logDiv = document.getElementById('results-log');

            if (currentStep === 0) {
                sessionResults.subAttire = getRandomItem(subAttirePool);
                logDiv.innerHTML = `<p><strong>Sub's Attire:</strong> ${sessionResults.subAttire}</p>`;
            } else if (currentStep === 1) {
                sessionResults.domAction = getRandomItem(domActionsPool);
                logDiv.innerHTML += `<p><strong>Mistress Action:</strong> ${sessionResults.domAction}</p>`;
            } else if (currentStep === 2) {
                sessionResults.step3Result = getRandomItem(step3Pool);
                logDiv.innerHTML += `<p><strong>Session Decree:</strong> ${sessionResults.step3Result}</p>`;
            } else if (currentStep === 3) {
                sessionResults.specialElement = getRandomItem(specialGameElementPool);
                logDiv.innerHTML += `<p><strong>Special Game Element:</strong> ${sessionResults.specialElement}</p>`;
            }

            currentStep++;
            updateStepPrompt();
        }

        // --- 10-MINUTE STRUCTURED STROKING ENGINE ---
        let currentStageIndex = 0;
        let stageTimer;
        let stageSecondsLeft = 0;
        let stageTotalSeconds = 0;

        const stages = [
            {
                name: "Stage 1: Warm-Up (Conditioning)",
                duration: 180, // 3 minutes
                instructions: "Get accustomed to the attire. Slow, deliberate friction to warm the body up.",
                commands: [
                    "SLOW LIGHT STROKES", 
                    "BUILD GENTLE RHYTHM", 
                    "STAY RELAXED", 
                    "ESTABLISH BASELINE"
                ]
            },
            {
                name: "Stage 2: Build & Pace (Escalation)",
                duration: 240, // 4 minutes
                instructions: "Increase the tempo. Active Mistress action integration begins now.",
                commands: [
                    "STEADY RHYTHMIC STROKING", 
                    "BUILD THE PRESSURE", 
                    "PICK UP THE PACE", 
                    "CONTROLLED BREATHING", 
                    "DECREE CHECK INCOMING"
                ]
            },
            {
                name: "Stage 3: Peak Tease & Edging",
                duration: 180, // 3 minutes
                instructions: "The danger zone. Absolute obedience required. Edging and heavy tease sequences.",
                commands: [
                    "FAST RHYTHM", 
                    "APPROACHING EDGE", 
                    "HOLD THE EDGE NOW", 
                    "ABSOLUTE STILLNESS", 
                    "DO NOT COME / DENIED"
                ]
            }
        ];

        function launchMainEvent() {
            document.getElementById('game-sequence').classList.add('hidden');
            document.getElementById('main-event-screen').classList.remove('hidden');
            loadStage(0);
        }

        function loadStage(index) {
            if (index >= stages.length) {
                endGameSession();
                return;
            }
            currentStageIndex = index;
            const stage = stages[currentStageIndex];
            
            document.getElementById('stage-title').textContent = stage.name;
            document.getElementById('stage-instructions').textContent = stage.instructions;
            
            stageSecondsLeft = stage.duration;
            stageTotalSeconds = stage.duration;
            
            runStageLoop();
        }

        function runStageLoop() {
            clearInterval(stageTimer);
            let progress = 0;

            stageTimer = setInterval(() => {
                stageSecondsLeft--;
                progress = ((stageTotalSeconds - stageSecondsLeft) / stageTotalSeconds) * 100;

                document.getElementById('progress-bar').style.width = progress + '%';
                
                let mins = Math.floor(stageSecondsLeft / 60);
                let secs = stageSecondsLeft % 60;
                document.getElementById('timer-display').textContent = 
                    `Stage Time Left: ${mins}:${secs < 10 ? '0' : ''}${secs}`;

                // Cycle granular commands every 12 seconds
                const stage = stages[currentStageIndex];
                if (stageSecondsLeft % 12 === 0) {
                    document.getElementById('live-command').textContent = getRandomItem(stage.commands);
                }

                // Dynamic mid-stage automated task injection based on roulette results
                if (stageSecondsLeft === Math.floor(stageTotalSeconds / 2)) {
                    document.getElementById('task-text').innerHTML = 
                        `<strong>MANDATORY ACTION:</strong> ${sessionResults.domAction}<br>` +
                        `<strong>SPECIAL DIRECTIVE:</strong> ${sessionResults.specialElement}`;
                } else if (stageSecondsLeft === stageTotalSeconds - 5) {
                    document.getElementById('task-text').innerHTML = 
                        `Current Rule Focus: ${sessionResults.step3Result} | Attire: ${sessionResults.subAttire}`;
                }

                if (stageSecondsLeft <= 0) {
                    clearInterval(stageTimer);
                    loadStage(currentStageIndex + 1);
                }
            }, 1000);
        }

        function skipStage() {
            clearInterval(stageTimer);
            loadStage(currentStageIndex + 1);
        }

        function previewDecree() {
            alert(`MISTRESS PREPARATION INFO:\n\n` +
                  `- Sub Attire: ${sessionResults.subAttire}\n` +
                  `- Permitted Action: ${sessionResults.domAction}\n` +
                  `- Special Element: ${sessionResults.specialElement}\n` +
                  `- Final Decree: ${sessionResults.step3Result}\n\n` +
                  `Prepare any necessary tools, cleaning gear, or restraints right now.`);
        }

        function endGameSession() {
            document.getElementById('main-event-screen').innerHTML = `
                <h3 class="prompt-title">Session Complete (10-Min Target Reached)</h3>
                <p>Final Ruling: <strong>${sessionResults.step3Result}</strong></p>
                <p><em>Accidental spillage note:</em> Tough luck—it is entirely up to the Mistress whether it is ignored or punished.</p>
                <p>Execute final protocol.</p>
                <button onclick="location.reload()">Start New Session</button>
            `;
        }
    </script>

</body>
</html>
