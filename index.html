<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Roulette & Cock Hero</title>
    <style>
        body {
            font-family: monospace, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 500px;
            text-align: center;
        }
        button {
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #3700b3;
            color: #ffffff;
        }
        .display-box {
            margin-top: 20px;
            text-align: left;
            background: #2d2d2d;
            padding: 15px;
            border-radius: 4px;
            min-height: 100px;
        }
        .display-box p {
            margin: 8px 0;
            font-size: 0.95rem;
        }
        .hidden {
            display: none;
        }
        .prompt-title {
            color: #bb86fc;
            font-weight: bold;
        }
        /* Main Event Styles */
        #main-event-screen {
            text-align: center;
        }
        .command-display {
            font-size: 2rem;
            font-weight: bold;
            color: #ff7597;
            margin: 20px 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121212;
            border-radius: 4px;
        }
        .meter-container {
            width: 100%;
            background: #2d2d2d;
            border-radius: 4px;
            height: 20px;
            margin: 15px 0;
            overflow: hidden;
        }
        .meter-bar {
            height: 100%;
            width: 0%;
            background: #bb86fc;
            transition: width 0.5s linear;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Session Roulette & Game</h2>
        
        <!-- SETUP PHASE -->
        <div id="game-intro">
            <p>Ready to establish the rules of engagement?</p>
            <button onclick="startSequence()">Begin Setup</button>
        </div>

        <div id="game-sequence" class="hidden">
            <p id="instruction-text" class="prompt-title"></p>
            <button id="action-btn" onclick="nextStep()">Press to Roll</button>
            
            <div class="display-box" id="results-log">
                <p><em>Waiting for rolls...</em></p>
            </div>
        </div>

        <!-- MAIN EVENT PHASE -->
        <div id="main-event-screen" class="hidden">
            <h3 id="phase-title" class="prompt-title">Phase: Warmup</h3>
            <p id="rule-reminder" style="font-size: 0.85rem; color: #aaa;"></p>
            
            <div class="command-display" id="live-command">STAND BY...</div>
            
            <div class="meter-container">
                <div class="meter-bar" id="progress-bar"></div>
            </div>
            
            <p id="timer-display">Time Remaining: 30s</p>
            <button id="pause-btn" onclick="triggerSpecialEvent()">Special Decree Check</button>
        </div>

    </div>

    <script>
        const subAttirePool = [
            "Fully strapped / harness", 
            "Completely bare / exposed", 
            "Locked in chastity", 
            "Collared and restrained"
        ];

        const domActionsPool = [
            "Choke the sub", 
            "Make them suck something", 
            "Spit at/on them", 
            "Slap / impact play"
        ];

        const step3Pool = [
            "Allowed 1 full orgasm", 
            "Strictly ruined / denied", 
            "Edge-fed only (permitted at very end)", 
            "Edged 3 times then permitted"
        ];

        const specialGameElementPool = [
            "Mandatory absolute stillness command during peak intensity", 
            "Forced oral break", 
            "Sudden pain play interval trigger", 
            "Forced humiliation speech check"
        ];

        let currentStep = 0;
        let sessionResults = {
            subAttire: "",
            domAction: "",
            step3Result: "",
            specialElement: ""
        };

        function startSequence() {
            document.getElementById('game-intro').classList.add('hidden');
            document.getElementById('game-sequence').classList.remove('hidden');
            updateStepPrompt();
        }

        function updateStepPrompt() {
            const instruction = document.getElementById('instruction-text');
            const btn = document.getElementById('action-btn');

            if (currentStep === 0) {
                instruction.textContent = "Mistress, you're up first. Press to determine what your sub must wear:";
                btn.textContent = "Roll Sub's Attire";
            } else if (currentStep === 1) {
                instruction.textContent = "Sub's turn to press. Let's see what the Mistress is permitted to do:";
                btn.textContent = "Roll Mistress Action";
            } else if (currentStep === 2) {
                instruction.textContent = "Third press: Determining the session outcome/limit:";
                btn.textContent = "Roll Session Decree";
            } else if (currentStep === 3) {
                instruction.textContent = "Final press: Unlocking the Mistress's special game element for the main event:";
                btn.textContent = "Roll Special Game Element";
            } else {
                instruction.textContent = "Setup Complete. Rules locked.";
                btn.textContent = "Launch Cock Hero Game";
                btn.onclick = launchMainEvent;
            }
        }

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function nextStep() {
            const logDiv = document.getElementById('results-log');

            if (currentStep === 0) {
                sessionResults.subAttire = getRandomItem(subAttirePool);
                logDiv.innerHTML = `<p><strong>Sub's Attire:</strong> ${sessionResults.subAttire}</p>`;
            } else if (currentStep === 1) {
                sessionResults.domAction = getRandomItem(domActionsPool);
                logDiv.innerHTML += `<p><strong>Mistress Action:</strong> ${sessionResults.domAction}</p>`;
            } else if (currentStep === 2) {
                sessionResults.step3Result = getRandomItem(step3Pool);
                logDiv.innerHTML += `<p><strong>Session Decree:</strong> ${sessionResults.step3Result}</p>`;
            } else if (currentStep === 3) {
                sessionResults.specialElement = getRandomItem(specialGameElementPool);
                logDiv.innerHTML += `<p><strong>Special Game Element:</strong> ${sessionResults.specialElement}</p>`;
            }

            currentStep++;
            updateStepPrompt();
        }

        // --- MAIN EVENT LOGIC ---
        let gameInterval;
        let timeLeft = 30;
        const commands = ["STROKE", "SLOW", "EDGE", "HOLD", "FAST"];

        function launchMainEvent() {
            document.getElementById('game-sequence').classList.add('hidden');
            document.getElementById('main-event-screen').classList.remove('hidden');
            
            // Display active rules reminder on screen
            document.getElementById('rule-reminder').textContent = 
                `Decree: ${sessionResults.step3Result} | Action: ${sessionResults.domAction}`;

            startMainLoop();
        }

        function startMainLoop() {
            let progress = 0;
            gameInterval = setInterval(() => {
                timeLeft--;
                progress += (100 / 30);
                
                document.getElementById('progress-bar').style.width = progress + '%';
                document.getElementById('timer-display').textContent = `Time Remaining: ${timeLeft}s`;

                // Randomly change commands
                if (timeLeft % 5 === 0) {
                    document.getElementById('live-command').textContent = getRandomItem(commands);
                }

                if (timeLeft <= 0) {
                    clearInterval(gameInterval);
                    endGameSession();
                }
            }, 1000);
        }

        function triggerSpecialEvent() {
            alert(`SPECIAL TRIGGER ACTIVE: ${sessionResults.specialElement}\nExecute rule now, Mistress.`);
        }

        function endGameSession() {
            document.getElementById('main-event-screen').innerHTML = `
                <h3 class="prompt-title">Session Complete</h3>
                <p>Final Ruling: <strong>${sessionResults.step3Result}</strong></p>
                <p>Execute the decree accordingly.</p>
                <button onclick="location.reload()">Play Again</button>
            `;
        }
    </script>

</body>
</html>
